# Place search for the app. Bound to localhost: only the Node server talks to
# it (PHOTON_URL=http://127.0.0.1:2322/api/), never the public internet.
services:
  photon:
    build: .
    container_name: photon
    restart: unless-stopped
    ports:
      - "127.0.0.1:2322:2322"
    volumes:
      - photon-data:/photon/data
    environment:
      # Malaysia + Singapore index is small; 1 GB heap is plenty.
      JAVA_OPTS: "-Xms512m -Xmx1g"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:2322/api/?q=kuala+lumpur&limit=1"]
      interval: 60s
      timeout: 5s
      start_period: 15m
      retries: 3

volumes:
  photon-data:
